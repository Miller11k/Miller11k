name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"    # daily at 03:00 UTC
  workflow_dispatch:        # manual trigger from Actions tab

permissions:
  contents: write           # needed to commit generated SVGs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stats card
      - uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Top languages card
      - uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # SAGE repo pin card
      - uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Agentic-Figure-Drawing&theme=tokyonight&hide_border=true
          path: profile/pin-sage.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Commit only if SVGs changed
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
